<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-container" class="container">
        <div class="login-box">
            <h1>LOCALCHAT</h1>
            <p>enter password</p>
            <form id="login-form">
                <input
                    type="text"
                    id="username-input"
                    placeholder="name"
                    maxlength="20"
                >
                <input
                    type="password"
                    id="password-input"
                    placeholder="password"
                    required
                >
                <button type="submit">enter</button>
                <div id="login-error" class="error"></div>
            </form>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-container" class="container hidden">
        <div class="chat-box">
            <div class="chat-header">
                <h2>LOCALCHAT</h2>
                <div class="user-info">
                    <span id="current-username"></span>
                    <span id="user-count" class="user-count">0 users online</span>
                </div>
            </div>

            <div id="messages" class="messages"></div>

            <div class="input-area">
                <input
                    type="text"
                    id="message-input"
                    placeholder="message"
                    autocomplete="off"
                    maxlength="1000"
                >
                <label for="image-input" class="image-button" title="Send image">
                    [img]
                </label>
                <input
                    type="file"
                    id="image-input"
                    accept="image/*"
                    style="display: none;"
                >
                <button id="send-button">send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
